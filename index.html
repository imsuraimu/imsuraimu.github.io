<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私のホームページ</title>
    <style>
        /* 簡単なデザイン（CSS）を直接書いています */
        body {
            font-family: "Helvetica Neue", Arial, "ひらがな角ゴ Pro W3", sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 2rem 1rem;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        section {
            background: #fff;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 0.5rem;
        }
        footer {
            text-align: center;
            padding: 1rem;
            color: #777;
            font-size: 0.9rem;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>ようこそ！私のWebサイトへ</h1>
        <p>HTMLの練習で作成した自己紹介ページです</p>
    </header>

    <main>
        <section>
            <h2>自己紹介</h2>
            <p>はじめまして！Webサイトの公開に挑戦しています。</p>
        </section>

        <section>
            <h2>なんらかのリスト</h2>
            <ul>
                <li>AAAAAAAAAAA</li>
                <li>BBBBBBBBBBB</li>
                <li>CCCCCCCCCCC</li>
            </ul>
        </section>

        <section>
            <h2>リンク</h2>
            <p>お気に入りのサイトやSNSへのリンクです。</p>
            <ul>
                <li><a href="https://github.com" target="_blank" rel="noopener">GitHub</a></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 マイホームページ All Rights Reserved.</p>
    </footer>

</body>
</html>
